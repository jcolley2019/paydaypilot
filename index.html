<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Payday-centric personal finance — bills mapped to paychecks." />
    <title>PaydayPilot</title>

    <!-- iOS: Add to Home Screen full-screen standalone -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PaydayPilot" />

    <script>
      (function () {
        try {
          if (localStorage.getItem('pp-theme') === 'paper') {
            document.documentElement.classList.remove('dark')
            document.documentElement.setAttribute('data-theme', 'paper')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
